[package]
name = "matrix-notify-action"
description = "Send notification to Matrix"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "matrix-notify-action"
path = "src/main.rs"

[dependencies]
matrix-sdk = { version = "0.10", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "sqlite",
  "bundled-sqlite",
  "rustls-tls",
] }
tokio = { version = "1", features = ["full"] }
pulldown-cmark = "0.12"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
