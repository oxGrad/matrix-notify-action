name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "matrix-notify-action") | .version')
          if [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "Version check passed: $CARGO"

  build:
    needs: [verify-version]
    runs-on: ubuntu-latest
    name: Build linux-musl binary
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/matrix-notify-action .
          tar -czf linux.tgz matrix-notify-action

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: linux.tgz

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Create GitHub Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/linux.tgz
          body_path: CHANGES.md

      - name: Update floating major tag
        run: |
          MAJOR="v$(echo "${{ github.ref_name }}" | cut -d. -f1 | tr -d 'v')"
          git tag -f "${MAJOR}"
          git push origin "${MAJOR}" --force
